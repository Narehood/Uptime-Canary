<style>
/* =====================================================================
   Uptime Canary — dashboard concept
   Self-contained: no network requests, no external fonts or libraries.
   Embedding rules honoured: no viewport-height units, no height:100% on
   html/body, outermost element has no background or horizontal padding.
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light dark}
body{margin:0}

.uc{
  container:app/inline-size;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  /* light surfaces + ink (warm neutral, validated contrast in docs/design.md) */
  --page:#f3f2ee; --surface:#fcfcfb; --surface-2:#f1f0ec; --surface-3:#e8e7e1;
  --text-1:#0b0b0b; --text-2:#52514e; --text-3:#6f6d68; --tick:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --border-2:rgba(11,11,11,.18);
  /* single data/interactive hue */
  --accent:#2a78d6; --accent-text:#1c5cab; --accent-btn:#256abf; --accent-wash:rgba(42,120,214,.10);
  /* status: reserved meaning, always shape + label */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --neutral:#898781;
  --warn-edge:#a86f00; --serious-edge:#b5532c; /* lift sub-3:1 fills to non-text contrast */
  --good-wash:rgba(12,163,12,.11); --warning-wash:rgba(250,178,25,.18); --serious-wash:rgba(236,131,90,.17);
  --critical-wash:rgba(208,59,59,.10); --neutral-wash:rgba(137,135,129,.13);
  --up-cell:rgba(12,163,12,.30); --hatch:rgba(11,11,11,.20); --hatch-soft:rgba(11,11,11,.09);
  /* concept annotations (not product UI) */
  --note:#6250d6; --note-text:#4a3aa7; --note-wash:rgba(98,80,214,.07);
  /* brand: canary yellow lives only on the ink rail and in illustrations */
  --ink:#151514; --ink-text:#c3c2b7; --ink-text-1:#f0efec; --ink-muted:#a3a198;
  --canary:#ffd23f; --canary-deep:#e9a800; --beak:#f28c28;
  --tip-bg:#1c1c1b; --tip-fg:#f0efec; --tip-2:#c3c2b7;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 12px 32px -14px rgba(11,11,11,.28);
  font:14px/1.45 var(--font); color:var(--text-1);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.uc[data-mode="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222220; --surface-3:#2c2c2a;
  --text-1:#f0efec; --text-2:#c3c2b7; --text-3:#a3a198; --tick:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.18);
  --accent:#3987e5; --accent-text:#6da7ec; --accent-btn:#256abf; --accent-wash:rgba(57,135,229,.14);
  --warn-edge:#fab219; --serious-edge:#ec835a;
  --good-wash:rgba(12,163,12,.16); --warning-wash:rgba(250,178,25,.13); --serious-wash:rgba(236,131,90,.15);
  --critical-wash:rgba(208,59,59,.20); --neutral-wash:rgba(137,135,129,.16);
  --up-cell:rgba(12,163,12,.40); --hatch:rgba(255,255,255,.22); --hatch-soft:rgba(255,255,255,.08);
  --note:#9085e9; --note-text:#b2a9f3; --note-wash:rgba(144,133,233,.09);
  --ink:#111110;
  --tip-bg:#2c2c2a; --tip-fg:#f0efec; --tip-2:#c3c2b7;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -14px rgba(0,0,0,.8);
}
.uc button,.uc input,.uc select{font:inherit;color:inherit}
.uc a{color:var(--accent-text);text-decoration:none}
.uc a:hover{text-decoration:underline}
.uc :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.uc h1,.uc h2,.uc h3{margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--text-3)}
.sec{color:var(--text-2)}
.nowrap{white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--accent-btn);color:#fff!important;padding:8px 12px;border-radius:8px}
.skip:focus{top:12px}

/* ---------- frame ---------- */
.frame{background:var(--page);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}

/* ---------- concept bar (not product UI) ---------- */
.concept{border:1.5px dashed var(--note);background:var(--note-wash);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;font-size:12.5px;color:var(--text-2)}
.concept .tag{font:700 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--note-text);border:1.5px solid var(--note);border-radius:5px;padding:4px 6px}
.concept .lead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.concept .lead b{color:var(--text-1);font-weight:650}
.cgrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cgrp>.cl{color:var(--note-text);font-weight:650}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:7px;cursor:pointer;color:var(--text-2);font-size:12.5px;min-height:30px;white-space:nowrap}
.seg button:hover{background:var(--surface-2);color:var(--text-1)}
.seg button[aria-pressed="true"]{background:var(--text-1);color:var(--surface);font-weight:600}
.seg.note button[aria-pressed="true"]{background:var(--note);color:#fff}
.uc[data-mode="dark"] .seg.note button[aria-pressed="true"]{color:#141413}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;padding:4px 2px;color:var(--text-2);font-size:12.5px;min-height:30px}
.switch .tr{width:30px;height:18px;border-radius:999px;background:var(--surface-3);position:relative;border:1px solid var(--border-2);transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"] .tr{background:var(--note)}
.switch[aria-checked="true"] .tr::after{transform:translateX(12px)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);gap:16px;align-items:start}
.rail{position:sticky;top:12px;z-index:20;background:var(--ink);color:var(--ink-text);border-radius:14px;padding:14px 10px 12px;display:flex;flex-direction:column;gap:14px;border:1px solid rgba(255,255,255,.05)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 4px;color:var(--ink-text-1)!important;text-decoration:none!important}
.brand svg{width:38px;height:38px;flex:none}
.wordmark{display:flex;flex-direction:column;line-height:1.1}
.wordmark b{font-size:16px;letter-spacing:-.01em;color:var(--ink-text-1);font-weight:700}
.wordmark b span{font-weight:450;color:var(--ink-text)}
.wordmark small{font:11px var(--mono);color:var(--ink-muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink-text);font-weight:500;text-decoration:none!important;min-height:40px}
.nav a:hover{background:rgba(255,255,255,.06);color:var(--ink-text-1)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.10);color:var(--ink-text-1)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--canary)}
.nav .ic{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:999px;background:#d03b3b;color:#fff;text-align:center;line-height:1.5}
.nav .badge.soft{background:rgba(255,255,255,.14);color:var(--ink-text-1)}
.nav .uc-focus:focus-visible{outline-color:#6da7ec}
.rail :focus-visible{outline-color:#6da7ec}
.rail-foot{margin-top:6px;border-top:1px solid rgba(255,255,255,.08);padding:12px 8px 2px;font-size:12px;color:var(--ink-muted);display:flex;flex-direction:column;gap:6px}
.rail-foot .row{display:flex;align-items:center;gap:8px;color:var(--ink-text)}
.rail-foot .g{width:14px;height:14px}

/* ---------- topbar ---------- */
.work{min-width:0;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.tb-btn{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:5px 10px 5px 6px;cursor:pointer;min-height:42px;text-align:left}
.tb-btn:hover{border-color:var(--border-2)}
.tb-btn .ic{width:16px;height:16px;color:var(--text-3)}
.ep-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center;flex:none}
.ep-mark svg{width:22px;height:22px}
.tb-btn .t1{display:block;font-weight:650;font-size:13.5px;line-height:1.2}
.tb-btn .t2{display:block;font-size:12px;color:var(--text-3);line-height:1.2}
.search{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:0 10px;min-height:42px}
.search .ic{width:16px;height:16px;color:var(--text-3);flex:none}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;height:40px;font-size:13.5px}
.search input::placeholder{color:var(--text-3)}
.search:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.snap{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);padding:0 6px;white-space:nowrap}
.snap .ic{width:14px;height:14px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text-2)}
.icon-btn:hover{color:var(--text-1);border-color:var(--border-2)}
.icon-btn .ic{width:18px;height:18px}
.me{display:inline-flex;align-items:center;gap:8px;padding:0 4px 0 2px;font-size:12.5px}
.me .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-weight:700;font-size:12px;color:var(--text-1)}
.me .who b{display:block;font-size:13px;line-height:1.2}
.me .who span{display:block;color:var(--text-3);font-size:12px;line-height:1.2}
.pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:min(380px,100%);background:var(--surface);border:1px solid var(--border-2);border-radius:14px;box-shadow:var(--shadow);padding:8px}
.pop h3{font-size:12px;color:var(--text-3);font-weight:600;padding:6px 8px 4px}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:9px;padding:8px;cursor:pointer;text-align:left;min-height:44px}
.pop-item:hover{background:var(--surface-2)}
.pop-item[aria-current="true"]{background:var(--accent-wash)}
.pop-item .grow{flex:1;min-width:0}
.pop-item .t2{font-size:12px;color:var(--text-3)}
.pop-foot{border-top:1px solid var(--grid);margin-top:6px;padding:8px 8px 4px;font-size:12px;color:var(--text-2)}

/* ---------- views ---------- */
main{outline:none;min-width:0}
.view{display:flex;flex-direction:column;gap:16px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.vhead h1{font-size:24px;line-height:1.2;letter-spacing:-.015em;font-weight:700;outline:none}
.vhead .sub{color:var(--text-2);font-size:13px;margin-top:4px}
.vhead .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs{font-size:12.5px;color:var(--text-3);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.crumbs .ic{width:12px;height:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{font-size:15px;letter-spacing:-.005em;font-weight:650}
.card-h .hint{font-size:12.5px;color:var(--text-3);margin-top:2px}
.card-h .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.vstack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.divider{height:1px;background:var(--grid);margin:12px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;min-height:36px;color:var(--text-1);text-decoration:none!important;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn .ic{width:15px;height:15px}
.btn.primary{background:var(--accent-btn);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent-btn)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12.5px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-text);cursor:pointer;font-weight:600;font-size:inherit}
.linkbtn:hover{text-decoration:underline}

/* filter row */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;min-height:32px;color:var(--text-2)}
.fchip:hover{border-color:var(--border-2);color:var(--text-1)}
.fchip[aria-pressed="true"]{background:var(--text-1);border-color:var(--text-1);color:var(--surface);font-weight:600}
.fchip .n{font-variant-numeric:tabular-nums;opacity:.8}

/* status glyphs: shape carries meaning, colour reinforces */
.g{display:inline-flex;width:16px;height:16px;flex:none;vertical-align:-3px;forced-color-adjust:none}
.g svg{width:100%;height:100%;overflow:visible}
.g-up{color:var(--good)} .g-down{color:var(--critical)} .g-warn{color:var(--warning)} .g-serious{color:var(--serious)}
.g-unknown,.g-paused,.g-none{color:var(--neutral)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 5px;font-size:12.5px;line-height:1.35;white-space:nowrap;background:var(--neutral-wash);color:var(--text-1)}
.chip b{font-weight:650}
.chip>span:not(.g){color:var(--text-2)}
.chip.c-down{background:var(--critical-wash)} .chip.c-warn{background:var(--warning-wash)}
.chip.c-serious{background:var(--serious-wash)} .chip.c-up{background:var(--good-wash)}
.chip.plain{background:var(--surface-2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--text-2);white-space:nowrap;border:1px solid var(--border)}
.tag.dup{background:var(--accent-wash);color:var(--text-1);border-color:transparent}
.tag .ic{width:12px;height:12px}

/* open-decision annotations */
.od{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--note);background:var(--note-wash);color:var(--note-text);border-radius:999px;padding:2px 10px 2px 8px;font-size:11.5px;font-weight:650;cursor:help;white-space:nowrap;min-height:26px;line-height:1.2}
.od::before{content:"";width:7px;height:7px;transform:rotate(45deg);border:1.5px solid currentColor;border-radius:1.5px;flex:none}
.uc[data-notes="off"] .od{display:none}
.flash{display:inline-flex;align-items:center;gap:6px;background:var(--note-wash);border:1.5px dashed var(--note);color:var(--note-text);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600}

/* headline + KPI */
.headline{font-size:20px;line-height:1.35;font-weight:650;letter-spacing:-.012em;margin:0;max-width:62ch}
.headline .q{color:var(--text-2);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--surface-2);border-radius:11px;padding:12px 13px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.kpi .v small{font-size:15px;font-weight:550;color:var(--text-2);letter-spacing:0}
.kpi .s{font-size:12px;color:var(--text-3);margin-top:2px}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:13px;padding:12px 14px;background:var(--warning-wash);border:1px solid rgba(250,178,25,.55)}
.banner .g{width:20px;height:20px;margin-top:1px}
.banner .bt{display:block;font-size:14px;margin-bottom:2px}
.banner p{margin:0;color:var(--text-2);font-size:13px;max-width:80ch}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.banner.info{background:var(--surface);border-color:var(--border)}

/* ---------- status board (matrix) ---------- */
.mx-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.mx th,.mx td{border-bottom:1px solid var(--grid);padding:9px 6px}
.mx thead th{font-weight:600;font-size:12px;color:var(--text-3);text-align:center;vertical-align:bottom;border-bottom-color:var(--axis);padding-top:4px}
.mx thead th.l{text-align:left}
.nh{display:inline-flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;cursor:pointer;color:var(--text-2);padding:3px 4px;border-radius:7px;min-width:52px}
.nh:hover{background:var(--surface-2);color:var(--text-1)}
.nh .mono{font-size:11.5px;font-weight:600;white-space:nowrap}
.nh .g{width:12px;height:12px}
.nh.ep .mono{color:var(--text-1)}
.nh.ep::after{content:"endpoint";font-size:10px;color:var(--text-3);font-weight:500}
.mx tbody tr{cursor:pointer}
.mx tbody tr:hover>*{background:var(--surface-2)}
.mx th.mon{text-align:left;font-weight:500;min-width:190px}
.mx th.mon a{color:var(--text-1);font-weight:650}
.mx th.mon .tgt{display:block;font:11.5px var(--mono);color:var(--text-3);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx td.st{white-space:nowrap}
.mx .st-inline{display:none}
.mx td.c{text-align:center;width:64px}
.mx td.c .g{width:18px;height:18px}
.mx td.c.out{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 6px)}
.mx tbody tr:hover>td.c.out{background-color:var(--surface-2)}
.ttype{font:600 10px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--border-2);border-radius:4px;padding:2px 4px;margin-left:6px;vertical-align:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-2);align-items:center;margin-top:12px}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:12px;border-radius:3px;display:inline-block}
.sw.up{background:var(--up-cell)} .sw.down{background:var(--critical)} .sw.part{background:var(--warning)}
.sw.out{background:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,transparent 1.5px 4px);box-shadow:inset 0 0 0 1px var(--hatch)}
.sw.line{height:2px;width:16px;background:var(--accent);border-radius:2px}
.sw.band{background:var(--critical-wash);box-shadow:inset 0 0 0 1px rgba(208,59,59,.35)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 12px;color:var(--text-2)}
.empty svg{width:64px;height:64px}
.empty b{color:var(--text-1);font-size:15px}

/* incident list */
.inc-list{display:flex;flex-direction:column}
.inc{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 12px;padding:12px 6px;border-bottom:1px solid var(--grid);color:inherit!important;text-decoration:none!important;border-radius:8px}
.inc:last-child{border-bottom:0}
.inc:hover{background:var(--surface-2)}
.inc>.g{width:18px;height:18px;margin-top:2px}
.inc .t{font-weight:650;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.inc .m{font-size:12.5px;color:var(--text-2);margin-top:2px}
.inc .d{font-size:12.5px;color:var(--text-2);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.inc .d .ic{width:14px;height:14px;color:var(--text-3)}
.inc .ch{color:var(--text-3);align-self:center}
.inc .ch .ic{width:16px;height:16px}
.dots{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--up-cell);display:block;forced-color-adjust:none}
.dots i.down{background:var(--critical)} .dots i.unknown{background:transparent;box-shadow:inset 0 0 0 1.5px var(--neutral)}
.dots i.paused{background:var(--neutral-wash)} .dots i.warn{background:var(--warning)}

/* node minis */
.nodes-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.nm{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:10px;background:var(--surface);color:inherit!important;text-decoration:none!important}
.nm:hover{border-color:var(--border-2)}
.nm.out{background-image:repeating-linear-gradient(135deg,var(--hatch-soft) 0 1px,transparent 1px 7px)}
.nm .g{margin-top:2px}
.nm b{display:block;font:650 13px var(--mono)}
.nm>span:not(.g){display:block;font-size:12px;color:var(--text-3)}
.nm>span:not(.g)>span{display:block}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:12px;font-weight:600;color:var(--text-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--axis);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .mono{white-space:nowrap}
.tbl td.tn{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.out td{background-image:repeating-linear-gradient(135deg,var(--hatch-soft) 0 1px,transparent 1px 7px)}
.tbl tr.ep td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl .msg{color:var(--text-2);font-size:12.5px}
.rowlink{cursor:pointer}
.rowlink:hover td{background-color:var(--surface-2)}

/* history strip */
.strip{display:flex;gap:2px;height:26px;align-items:stretch;forced-color-adjust:none}
.strip i{flex:1;min-width:2px;border-radius:2px;background:var(--up-cell)}
.strip i.d{background:var(--critical)} .strip i.p{background:var(--warning)}
.strip i.z{background:var(--neutral-wash)} .strip i.n{background:transparent;box-shadow:inset 0 0 0 1px var(--grid)}
.strip i:hover{outline:2px solid var(--text-1);outline-offset:0}
.axis-row{display:flex;justify-content:space-between;font-size:11px;color:var(--tick);margin-top:4px;font-variant-numeric:tabular-nums}

/* charts */
.chart{position:relative;outline:none}
.chart:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .tick{font:11px var(--font);fill:var(--tick);font-variant-numeric:tabular-nums}
.chart .lbl{font:600 12px var(--font);fill:var(--text-1)}
.chart .lbl2{font:11.5px var(--font);fill:var(--text-2)}
.chart .gridl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart .base{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.10}
.chart .band{fill:var(--critical-wash)}
.chart .bandedge{stroke:var(--critical);stroke-width:1;opacity:.5}
.chart .xh{stroke:var(--text-2);stroke-width:1;shape-rendering:crispEdges}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .s-up{fill:var(--up-cell)} .chart .s-down{fill:var(--critical)} .chart .s-paused{fill:var(--neutral-wash)}
.chart .s-unknown{fill:url(#uc-hatch)} .chart .s-none{fill:transparent}
.chart .hatch-bg{fill:var(--neutral-wash)} .chart .hatch-ln{stroke:var(--hatch);stroke-width:1.6}
.chart .mk{stroke:var(--surface);stroke-width:2;cursor:pointer}
.chart .mk:focus-visible{outline:none;stroke:var(--text-1)}
.chart .mk-fail{fill:var(--critical)} .chart .mk-send{fill:var(--accent)} .chart .mk-ok{fill:var(--good)}
.chart .mk-info{fill:var(--text-3)} .chart .mk-dup{fill:var(--accent)}
.chart .partbar{fill:var(--text-3);opacity:.55}
.chart .hit{fill:transparent}
.chart .edge-ok{stroke:var(--axis);stroke-width:1.6}
.chart .edge-down{stroke:var(--critical);stroke-width:1.8}
.chart .edge-unknown{stroke:var(--neutral);stroke-width:1.4;stroke-dasharray:2 4}
.chart .nodec{fill:var(--surface);stroke:var(--text-2);stroke-width:1.5}
.chart .nodec.ep{stroke:var(--accent);stroke-width:2.5}
.chart .nodec.out{stroke:var(--neutral);stroke-dasharray:3 3}
.chart .dim{opacity:.18}
.chart-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:10px}
.tip{position:absolute;z-index:100;pointer-events:none;max-width:300px;background:var(--tip-bg);color:var(--tip-fg);border-radius:9px;padding:8px 10px;font:12.5px/1.45 var(--font);box-shadow:0 8px 24px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08)}
.tip[hidden]{display:none}
.tip b{display:block;font-weight:650;margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:8px;color:var(--tip-2);font-variant-numeric:tabular-nums}
.tip .r strong{color:var(--tip-fg);min-width:54px}
.tip .r .k{width:10px;height:2px;border-radius:2px;background:var(--tip-2)}
.tip .r .k.focus{background:#6da7ec}
.tip .s{color:var(--tip-2)}

/* event log */
.evlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.evlog li{display:grid;grid-template-columns:62px 18px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13px;align-items:start}
.evlog li:last-child{border-bottom:0}
.evlog time{font-variant-numeric:tabular-nums;color:var(--text-3);font-size:12.5px;padding-top:1px}
.evlog .ev-ic{width:10px;height:10px;border-radius:50%;margin-top:5px;margin-left:4px;forced-color-adjust:none}
.ev-fail{background:var(--critical)} .ev-send{background:var(--accent)} .ev-ok{background:var(--good)} .ev-info{background:var(--text-3)} .ev-dup{background:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.evlog .det{display:block;color:var(--text-3);font-size:12.5px}
.evlog li.future time,.evlog li.future .tx{opacity:.75}

/* nodes */
.nodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ncard{border:1px solid var(--border);border-radius:13px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.ncard.ep{box-shadow:inset 0 0 0 1.5px var(--accent)}
.ncard.out .nc-h{background-image:repeating-linear-gradient(135deg,var(--hatch-soft) 0 1px,transparent 1px 7px);margin:-14px -14px 0;padding:14px;border-radius:13px 13px 0 0}
.nc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nc-h>div>b{font:700 15px var(--mono)}
.nc-h>div>span{display:block;font-size:12.5px;color:var(--text-3)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mesh{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:20px;align-items:center}
.reach th,.reach td{text-align:center;padding:7px 6px}
.reach th.l{text-align:right}
.reach td .g{width:16px;height:16px}
.reach td.self{color:var(--text-3)}
.reach td.out{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 6px)}
.reach small{display:block;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.path{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
.path .box{border:1px solid var(--border-2);border-radius:9px;padding:6px 10px;background:var(--surface);display:flex;gap:6px;align-items:center}
.path .box.opt{border-style:dashed}
.path .arr{color:var(--text-3)}

/* config */
.diff th,.diff td{padding:9px 10px}
.diff td.ch{background:var(--accent-wash);font-weight:600}
.diff label{display:flex;gap:8px;align-items:center;cursor:pointer}
.diff input[type=radio]{accent-color:var(--accent-btn);width:16px;height:16px}
.result{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-top:12px;padding:12px;border-radius:11px;background:var(--surface-2)}
.rev{font:600 11.5px var(--mono);background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;white-space:nowrap}
.cfg td.c{text-align:center}
.cfg td.c .rev{display:inline-block;margin-top:2px}
.cfg td.c.out{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 6px)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-2)}
.fld>span{font-weight:600;color:var(--text-1)}
.fld input[type=text],.fld input[type=url],.fld input[type=password],.fld select{border:1px solid var(--border-2);background:var(--surface);border-radius:9px;padding:0 10px;min-height:38px;font-size:13.5px;color:var(--text-1)}
.fld small{color:var(--text-3)}
.nodepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.nodepick label{display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:9px;padding:8px 10px;cursor:pointer;min-height:44px;font-size:12.5px}
.nodepick label:has(input:checked){border-color:var(--accent);background:var(--accent-wash)}
.nodepick input{accent-color:var(--accent-btn);width:16px;height:16px}
.nodepick b{font:650 12.5px var(--mono);display:block;color:var(--text-1)}
.order{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px}
.order .o{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--mono);border:1px solid var(--border);border-radius:7px;padding:2px 7px;background:var(--surface)}
.order .o i{font-style:normal;font:700 10px var(--font);color:var(--text-3)}
.order .o.sent{border-color:var(--accent);background:var(--accent-wash)}
.order .o.out{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 6px)}
.order .sep{color:var(--text-3)}

.ic{width:16px;height:16px;flex:none}
.prose{font-size:13px;color:var(--text-2);max-width:72ch}
.prose p{margin:0 0 8px}
.prose b{color:var(--text-1)}
.guar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.guar>div{background:var(--surface-2);border-radius:11px;padding:12px}
.guar b{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:13.5px}
.guar p{margin:0;font-size:12.5px;color:var(--text-2)}

/* ---------- container-based responsive layout ---------- */
@container app (max-width:1179px){
  .g2{grid-template-columns:minmax(0,1fr)}
}
@container app (max-width:1059px){
  .shell{grid-template-columns:64px minmax(0,1fr)}
  .rail{padding:12px 8px;align-items:center}
  .brand{padding:2px 0 4px}
  .wordmark,.nav .lbl,.rail-foot .txt{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .nav a{justify-content:center;padding:10px 0;width:46px}
  .nav a[aria-current="page"]::before{left:-8px}
  .nav .badge{position:absolute;top:1px;right:0;margin:0;min-width:17px;padding:0 4px;font-size:10px}
  .rail-foot{align-items:center;padding:10px 0 2px}
  .g2e{grid-template-columns:minmax(0,1fr)}
  .mx th.mon{min-width:0}
  .mx td.c{width:46px}
  .mx .st-col,.mx td.st{display:none}
  .mx .st-inline{display:block;margin-top:6px}
  .mx th.mon .tgt{max-width:220px}
  .nh{min-width:40px;padding:3px 0}
  .mx thead th{padding-left:2px;padding-right:2px}
  .me .who{display:none}
  .mesh{grid-template-columns:minmax(0,1fr)}
  .guar{grid-template-columns:minmax(0,1fr)}
}
@container app (max-width:699px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px}
  .rail{flex-direction:row;align-items:center;padding:8px;gap:6px;top:0;border-radius:12px}
  .brand svg{width:32px;height:32px}
  .nav{flex-direction:row;overflow-x:auto;flex:1;scrollbar-width:none;gap:2px;mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .nav::-webkit-scrollbar{display:none}
  .nav .lbl{position:static!important;width:auto;height:auto;overflow:visible;clip:auto;clip-path:none}
  .nav a{width:auto;padding:8px 10px;white-space:nowrap;min-height:44px}
  .nav a[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:2px;width:auto;height:3px;border-radius:3px}
  .nav .badge{position:static;margin-left:2px}
  .rail-foot{display:none}
  .vhead h1{font-size:21px}
  .headline{font-size:17px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:24px}
  .snap{display:none}
  .me .who{display:none}
  .search{order:5;flex-basis:100%}
  .form{grid-template-columns:minmax(0,1fr)}
  /* status board becomes one card per monitor */
  .mx thead{display:none}
  .mx,.mx tbody{display:block}
  .mx tr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:12px 4px;border-bottom:1px solid var(--grid)}
  .mx th,.mx td{border:0;padding:0}
  .mx th.mon{grid-column:1/-1;min-width:0}
  .mx td.st{display:block;grid-column:1/-1;margin:4px 0 6px}
  .mx .st-inline{display:none}
  .mx td.c{display:flex;flex-direction:column;align-items:center;gap:3px;width:auto;padding:6px 0;border-radius:7px;background-color:var(--surface-2)}
  .mx td.c::before{content:attr(data-node);font:600 10.5px var(--mono);color:var(--text-3)}
  /* quiet when healthy: up and paused rows collapse to one line */
  .mx tr.ok{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
  .mx tr.ok th.mon{grid-column:1}
  .mx tr.ok td.st{grid-column:2;margin:0}
  .mx tr.ok td.c{display:none}
  /* generic stacked tables */
  .tbl.stack thead{display:none}
  .tbl.stack,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td{display:block;width:100%}
  .tbl.stack tr{padding:10px 0;border-bottom:1px solid var(--grid)}
  .tbl.stack tr:last-child{border-bottom:0}
  .tbl.stack td{border:0;padding:3px 0;text-align:right;overflow:hidden}
  .tbl.stack td::before{content:attr(data-label);float:left;margin-right:12px;color:var(--text-3);font-size:12px;text-align:left}
  .tbl.stack td.lead{font-weight:650;text-align:left}
  .tbl.stack td.lead::before{display:none}
  .tbl.stack td.full{text-align:left}
  .tbl.stack td.full::before{float:none;display:block;margin-bottom:4px}
  .tbl.stack .num{text-align:right}
  .tbl.stack td.nil{display:none}
  .inc{grid-template-columns:20px minmax(0,1fr)}
  .inc .ch{display:none}
  .evlog li{grid-template-columns:54px 16px minmax(0,1fr);gap:8px}
}

@media (prefers-reduced-motion:reduce){.uc *{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){
  .chip,.kpi,.card,.fchip,.seg,.tb-btn,.ncard,.nm{border:1px solid CanvasText}
  .seg button[aria-pressed="true"],.fchip[aria-pressed="true"]{outline:2px solid Highlight}
  .nav a[aria-current="page"]{outline:2px solid Highlight}
}
@media print{.concept,.rail,.topbar{display:none}.shell{grid-template-columns:1fr}}
</style>

<body>
<div class="uc" id="uc" data-mode="light" data-notes="on">

<!-- Icon + status-glyph sprite. Status shapes: up = circle, down = square, warn = triangle,
     serious = diamond, unknown = dashed ring, paused = ring with bars, none = dash. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<defs>
<symbol id="i-overview" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></g></symbol>
<symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2.5 12.5h4l2.2-5.5 4.2 11 2.4-5.5h6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-incident" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8 21 19.5H3z"/><path d="M12 10v4.2"/><path d="M12 17.2h.01"/></g></symbol>
<symbol id="i-nodes" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6.5" r="2.6"/><circle cx="18" cy="6.5" r="2.6"/><circle cx="12" cy="17.5" r="2.6"/><path d="M8.6 6.5h6.8M7.3 8.8l3.4 6.4M16.7 8.8l-3.4 6.4"/></g></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.8h-15z"/><path d="M10 20.8a2.2 2.2 0 0 0 4 0"/></g></symbol>
<symbol id="i-config" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h8.5M17.5 7H20M4 17h2.5M11.5 17H20"/><circle cx="15" cy="7" r="2.4"/><circle cx="9" cy="17" r="2.4"/></g></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8.5" r="3.3"/><path d="M3 19.5c.7-3.3 3.2-5.2 6-5.2s5.3 1.9 6 5.2"/><path d="M15.5 5.4a3.2 3.2 0 0 1 0 6.2M17.6 14.6c1.8.7 3 2.4 3.4 4.9"/></g></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></g></symbol>

  thr: { label: 'At least 2 locations', short: '≥ 2 locations', test: (f, r) => f >= Math.min(2, r) },
  all: { label: 'All reporting locations', short: 'all locations', test: (f, r) => r > 0 && f === r },

const RANGES = { '1h': { ms: 60 * MIN, lat: MIN, strip: 2 * MIN, tick: 10 * MIN }, '6h': { ms: 360 * MIN, lat: 5 * MIN, strip: 10 * MIN, tick: 60 * MIN }, '24h': { ms: 1440 * MIN, lat: 15 * MIN, strip: 30 * MIN, tick: 240 * MIN } };

/* ---------- UI state ---------- */
const S = { scen: 'connected', policy: 'any', role: 'admin', notes: true, theme: 'system', ep: 'fra-1', route: '/overview', q: '', filt: 'all', lfilt: 'all', range: '6h', table: {}, newMon: false, pick: {}, pop: null, nm: { nodes: new Set(NID), type: 'http' }, reveal: false };

/* ---------- derived model ---------- */
const curPart = () => SCEN[S.scen].part;
const parts = () => [PAST_PART, curPart()].filter(Boolean);
function groupAt(n, t) { for (const p of parts()) if (t >= p.since && (p.until == null || t < p.until)) return p.groups.findIndex(g => g.includes(n)); return 0; }
const reachAt = (a, b, t) => groupAt(a, t) === groupAt(b, t);
const visible = n => reachAt(S.ep, n, NOW);
const lastSeen = n => visible(n) ? NOW : curPart().since;
const outNodes = () => NID.filter(n => !visible(n));
const can = what => what === 'edit' ? S.role !== 'viewer' : S.role === 'admin';
const startFor = (f, n) => f.start + ((f.stagger && f.stagger[n]) || 0) * 1000;
const failAt = (m, n, t) => (m.fail || []).find(f => f.nodes.includes(n) && startFor(f, n) <= t && (f.until == null || t < f.until));
function trueState(m, n, t) { if (!m.nodes.includes(n)) return 'none'; if (m.enabled === false && t >= m.pausedAt) return 'paused'; return failAt(m, n, t) ? 'down' : 'up'; }

function latAt(m, n, t) {

  const nd = NODE[n], mi = MON.indexOf(m), ni = NID.indexOf(n), b = Math.floor(t / MIN);
  let v = m.lat + nd.base * (m.type === 'ping' ? 0.6 : 0.92) + (rnd(mi, ni, b) - 0.5) * nd.base * 0.22 + (rnd(mi + 17, ni + 3, b >> 3) - 0.5) * 10;
  if (rnd(mi + 5, ni + 11, b) > 0.975) v += nd.base * 0.7 + 40;

}
function obs(m, n) {

  const at = checkedAt(m, n);
  if (m.conflict) return { st: 'unknown', why: 'conflict', last: st, at, rev: GA.includes(n) ? m.conflict.a.rev : m.conflict.b.rev };

function agg(m) {

  const unknown = os.filter(([, o]) => o.st === 'unknown').map(([n]) => n);

  const b = { os, failing, reporting, unknown, lastDown, f: failing.length, r: reporting.length, u: unknown.length, n: m.nodes.length };

const mons = () => { const q = S.q.trim().toLowerCase(); return MON.filter(m => !q || (m.name + ' ' + m.target + ' ' + m.nodes.join(' ') + ' ' + m.id).toLowerCase().includes(q)); };

function dupKey(r) { return r.mon + '|' + r.kind + '|' + (r.slot || 0) + '|' + episodeOf(r).id; }

function epClass(ep) {

const epEnd = ep => ep.open ? NOW : ep.f.resolvedAt;
function epReceipts(ep) { const end = epEnd(ep) + 2 * MIN; return receipts().filter(r => r.mon === ep.m.k && r.t >= ep.f.start - MIN && r.t <= end); }

/* ---------- markup helpers ---------- */
const ic = (id, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" aria-hidden="true" focusable="false"><use href="#${id}"/></svg>`;
const SYM = { up: 's-up', down: 's-down', warn: 's-warn', serious: 's-serious', unknown: 's-unknown', paused: 's-paused', none: 's-none' };

function chip(a) { const [g, l, s] = chipInfo(a); return `<span class="chip c-${g}">${glyph(g)}<b>${esc(l)}</b>${s ? `<span>${esc(s)}</span>` : ''}</span>`; }
const od = (title, text) => `<button type="button" class="od" data-tip="${esc(title + '\n' + text)}" aria-label="Design note: ${esc(title)}. ${esc(text)}">${esc(title)}</button>`;
const ttype = m => `<span class="ttype">${m.type === 'ping' ? 'ping' : 'http'}</span>`;
const rev = r => `<span class="rev" title="Revision ${esc(r)}">${esc(r.slice(0, 4))}</span>`;

  if (o.st === 'unknown') return `${head}\nNot in view since ${hm(o.at)} UTC\nLast known: ${o.last}. ${S.ep} cannot reach ${n}; ${n} keeps monitoring on its own.`;
  if (o.st === 'down') return `${head}\nDown since ${hms(o.since)} UTC\n${o.msg}\nLast check ${hms(o.at)}`;

/* ---------- views ---------- */
function vOverview() {

  const sentences = probs.slice(0, 3).map(({ m, a }) => {
    if (a.k === 'everywhere') return `<b>${esc(m.name)}</b> is down everywhere.`;
    if (a.k === 'partial') return `<b>${esc(m.name)}</b> is down from ${a.f === 1 ? esc(a.failing[0]) + ' only' : `${a.f} of ${a.n} locations`}${a.u ? ` (${a.u} not in view)` : ''}.`;

function emptyState(t, s) {

    <div class="legend" aria-label="Legend">${'<span>' + glyph('up') + 'Up</span><span>' + glyph('down') + 'Down</span>' + (S.policy !== 'any' ? '<span>' + glyph('warn') + 'Location issue</span>' : '') + '<span>' + glyph('serious') + 'Config conflict</span><span>' + glyph('unknown') + 'Unknown</span><span><i class="sw out"></i>Out of view</span><span>' + glyph('paused') + 'Paused</span><span>' + glyph('none') + 'Not assigned</span>'}</div>
  </section>`;
}
function deliveryLine(ep) {

function applyTheme() {
  const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
  const mode = S.theme === 'system' ? (mq && mq.matches ? 'dark' : 'light') : S.theme;
  uc.dataset.mode = mode; document.documentElement.style.colorScheme = S.theme === 'system' ? '' : mode;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (a && uc.contains(a)) { e.preventDefault(); go(a.getAttribute('href').slice(1)); return; }
  const b = e.target.closest('[data-act]');
  if (!b) {
    const row = e.target.closest('[data-href]'); if (row && !e.target.closest('button,input,label,select')) { go(row.dataset.href); return; }
    if (S.pop && !e.target.closest('#pop')) { S.pop = null; renderChrome(); }
    return;
  }
  const v = b.dataset.v, act = b.dataset.act;
  switch (act) {
    case 'scen': S.scen = v; if (v === 'connected') S.ep = S.ep; announce(`Scenario: ${SCEN[v].label}`); renderAll(); break;
    case 'policy': S.policy = v; announce(`Outage policy preview: ${POL[v].label}`); renderAll(); break;
    case 'role': S.role = v; if (v !== 'admin' && S.route.startsWith('/accounts')) S.route = '/overview'; announce(`Viewing as ${ROLE_LABEL[v]}`); renderAll(); break;
    case 'notes': S.notes = !S.notes; renderChrome(); break;
    case 'theme': S.theme = { system: 'light', light: 'dark', dark: 'system' }[S.theme]; applyTheme(); renderChrome(); announce(`Theme: ${S.theme}`); break;
    case 'pop': S.pop = S.pop === v ? null : v; renderChrome(); if (S.pop) { const f = pop.querySelector('button'); if (f) f.focus(); } break;
    case 'endpoint': S.ep = v; S.pop = null; announce(`Endpoint switched to ${v}`); renderAll(); document.getElementById('conn-btn').focus({ preventScroll: true }); break;
    case 'filt': S.filt = v; renderMain(); break;
    case 'lfilt': S.lfilt = v; renderMain(); break;
    case 'range': S.range = v; renderMain(); break;
    case 'table': S.table[v] = !S.table[v]; renderMain(); break;
    case 'newmon': S.newMon = !S.newMon; renderMain(); break;
    case 'nmtype': S.nm.type = v; renderMain(); break;
    case 'nmnode': if (b.checked) S.nm.nodes.add(v); else S.nm.nodes.delete(v); renderMain(); { const cb = main.querySelector(`[data-act="nmnode"][data-v="${v}"]`); if (cb) cb.focus({ preventScroll: true }); } return;
    case 'pick': S.pick[b.dataset.f] = v; renderMain(); { const r = main.querySelector(`[data-act="pick"][data-f="${b.dataset.f}"][data-v="${v}"]`); if (r) r.focus({ preventScroll: true }); } return;
    case 'pickall': { const c = MONK.billing.conflict; ['every', 'timeout', 'expect'].forEach(k => { S.pick[k] = v === 'both' ? (c.a[k] !== c.base[k] ? 'a' : 'b') : v; }); renderMain(); break; }
    case 'reveal': S.reveal = !S.reveal; renderMain(); break;
    case 'flash': if (!b.disabled) flash(b, v); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.pop) { S.pop = null; renderChrome(); document.getElementById('conn-btn').focus(); }
  if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) { e.preventDefault(); document.getElementById('q').focus(); }
  const row = e.target.closest && e.target.closest('tr[data-href]');
  if (row && e.key === 'Enter' && e.target === row) go(row.dataset.href);
});
document.getElementById('q').addEventListener('input', e => { S.q = e.target.value; const sec = S.route.split('/')[1]; if (sec !== 'overview' && !(sec === 'monitors' && !S.route.split('/')[2])) { S.route = '/monitors'; try { location.hash = S.route; } catch (er) {} renderChrome(); } renderMain(); });
window.addEventListener('hashchange', () => { const r = location.hash.slice(1) || '/overview'; if (r !== S.route && r.startsWith('/')) { S.route = r; renderAll(true); } });
if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener('change', applyTheme) : mq.addListener(applyTheme)); }

/* ---------- boot ---------- */
const h0 = (location.hash || '').slice(1); if (h0.startsWith('/')) S.route = h0;
/* Deep links for reviews: ?theme=light|dark&scen=partition&ep=sgp-1&role=viewer&policy=all&notes=off */
try { const q = new URLSearchParams(location.search);
  if (['light', 'dark', 'system'].includes(q.get('theme'))) S.theme = q.get('theme');
  if (SCEN[q.get('scen')]) S.scen = q.get('scen');
  if (NODE[q.get('ep')]) S.ep = q.get('ep');
  if (ROLE_LABEL[q.get('role')]) S.role = q.get('role');
  if (POL[q.get('policy')]) S.policy = q.get('policy');
  if (q.get('notes') === 'off') S.notes = false;
  if (q.get('newmon') === '1') S.newMon = true;
} catch (e) {}
applyTheme(); renderAll(false);
})();
</script>
</body>
</html>
