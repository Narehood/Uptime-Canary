<svg xmlns="http://www.w3.org/2000/svg" width="640" height="286" viewBox="0 0 640 286" role="img" aria-labelledby="t d">
<title id="t">Uptime Canary status badges</title>
<desc id="d">The badges the node serves at /public/badge/&lt;slug&gt;.svg, drawn by the node's renderer. Each has a dark ink label with the canary mark and the word status, then a state segment: up with a check in a circle on green, down with a cross in a rounded square on red, pending with a clock ring on neutral gray, and unknown with a dashed question ring on neutral gray. Maintenance adds a third amber segment with a wrench beside the measured state. Shape and word carry the meaning; color only reinforces it.</desc>
<style>.f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:11px;font-weight:600} .h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:12px;fill:#52514e} .k{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:11px;fill:#6f6d68}</style>
<rect width="640" height="286" rx="14" fill="#f3f2ee"/>
