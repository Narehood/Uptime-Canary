name: Container validation

on:
  pull_request:
    paths-ignore: [README.md, 'docs/**', 'design/**']
  push:
    branches: [main]
    paths-ignore: [README.md, 'docs/**', 'design/**']
  workflow_dispatch:
    inputs:
      dashboard_browser_only:
        description: Run the existing dashboard browser proof on Linux instead of the Alpine matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpine-runtime:
    if: github.event_name != 'workflow_dispatch' || !inputs.dashboard_browser_only
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        phase: [node, web, race, proof]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify embedded runtime provenance
        if: matrix.phase == 'node'
        run: |
          python3 -B scripts/verify-jsonquery-runtime.py
          python3 -B scripts/security-check-test.py
          python3 -B scripts/process_proof_validation_test.py
          python3 -B scripts/package_release_test.py
          python3 -B scripts/release_package_validation_test.py
      - name: Validate combined and separate deployment configurations
        if: matrix.phase == 'node'
        run: python3 -B scripts/deployment-config-validation.py
      - name: Stage clean source context
        run: |
          python3 scripts/alpine-validation-snapshot.py
          mkdir -p .canary/alpine-validation/source
          tar -xzf .canary/alpine-validation/source.tar.gz -C .canary/alpine-validation/source
      - name: Validate Alpine ${{ matrix.phase }} phase
        run: |
          case '${{ matrix.phase }}' in
            node) python3 scripts/alpine-validation.py --context .canary/alpine-validation/source --skip-web --skip-race ;;
            web) python3 scripts/alpine-validation.py --context .canary/alpine-validation/source --only web ;;
            race) python3 scripts/alpine-validation.py --context .canary/alpine-validation/source --only race ;;
            proof) python3 scripts/alpine-validation.py --context .canary/alpine-validation/source --only proof ;;
          esac
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpine-container-validation-${{ matrix.phase }}
          path: |
            .canary/alpine-validation/results/
            .canary/alpine-validation/source-manifest.json
            !.canary/alpine-validation/results/worker-race/**/canary-worker
            !.canary/alpine-validation/results/worker-race/**/process-fixture
          retention-days: 14
          include-hidden-files: true

  dashboard-browser:
    name: Dashboard browser proof
    if: github.event_name == 'workflow_dispatch' && inputs.dashboard_browser_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Bind the installed toolchain and browser
        shell: bash
        run: |
          mkdir -p .canary/tools
          test ! -e .canary/tools/go
          ln -s "$(go env GOROOT)" .canary/tools/go
          echo "GOCACHE=$GITHUB_WORKSPACE/.canary/cache/go-build" >> "$GITHUB_ENV"
          echo 'GOTOOLCHAIN=local' >> "$GITHUB_ENV"
          echo 'GOFLAGS=-p=1 -mod=readonly' >> "$GITHUB_ENV"
          dashboard_chrome="$(command -v google-chrome || command -v chromium)"
          echo "CHROME_PATH=$dashboard_chrome" >> "$GITHUB_ENV"
      - name: Install locked dependencies on the disposable runner
        run: |
          go mod download
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise the real dashboard and browser controls
        run: python3 scripts/bounded_validation.py --timeout 1200 -- node scripts/dashboard-contract-review.mjs --dashboard-control-plane --dashboard-only
      - name: Upload bounded browser evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-browser-proof
          path: |
            .canary/dashboard-contract-current.json
            .canary/work/current/latest.log
          retention-days: 14
          include-hidden-files: true
