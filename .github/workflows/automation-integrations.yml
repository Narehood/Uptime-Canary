name: Automation integrations

on:
  pull_request:
    paths-ignore: [README.md, 'docs/**', 'design/**']
  push:
    branches: [main]
    paths-ignore: [README.md, 'docs/**', 'design/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    # Individual guarded commands total 24.5 minutes; allow setup/upload headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Prepare one owned cache and installed toolchain
        run: |
          mkdir -p .canary/tools
          ln -s "$(go env GOROOT)" .canary/tools/go
          echo "GOCACHE=$GITHUB_WORKSPACE/.canary/cache/go-build" >> "$GITHUB_ENV"
          echo 'GOTOOLCHAIN=local' >> "$GITHUB_ENV"
          go mod download
          npm ci --ignore-scripts --no-audit --no-fund
          automation_chrome="$(command -v google-chrome || command -v chromium)"
          echo "CHROME_PATH=$automation_chrome" >> "$GITHUB_ENV"
      # Native provider/delivery/scheduling tests remain in the shipped-mode
      # Alpine go phase; delivery and canary also run under race.
      - name: Shared and frontend types
        run: python3 scripts/bounded_validation.py --timeout 120 -- npm run typecheck
      - name: Existing channel and template regressions
        run: python3 scripts/bounded_validation.py --timeout 120 -- node scripts/alert-templates-pure.mjs
      - name: Automation form and external dashboard contracts
        run: python3 scripts/bounded_validation.py --timeout 120 -- node scripts/automation-integrations-pure.mjs
      - name: Benchmark evidence isolation controls
        run: python3 scripts/bounded_validation.py --timeout 30 -- python3 -B scripts/automation-evidence-test.py
      - name: Delivery filtering equivalence
        run: |
          set +e
          python3 scripts/bounded_validation.py --timeout 120 -- node scripts/delivery-view-proof.mjs --benchmark
          validation_status=$?
          cat .canary/work/current/latest.log
          exit "$validation_status"
      - name: Dashboard derivation equivalence and measured performance
        run: |
          set +e
          python3 scripts/bounded_validation.py --timeout 180 -- node scripts/dashboard-operations-proof.mjs --benchmark
          validation_status=$?
          cat .canary/work/current/latest.log
          exit "$validation_status"
      - name: Retain dashboard measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dashboard-operations-evidence
          path: |
            .canary/work/current/latest.log
            .canary/work/current/latest.json
          include-hidden-files: true
          retention-days: 7
      - name: Fleet, maintenance and registry equivalence and measurements
        id: additional_measurements
        run: |
          rm -f -- .canary/work/current/latest.log .canary/work/current/latest.json
          echo 'evidence_cleared=true' >> "$GITHUB_OUTPUT"
          set +e
          python3 scripts/bounded_validation.py --timeout 180 -- node scripts/additional-operations-proof.mjs --benchmark
          validation_status=$?
          cat .canary/work/current/latest.log
          exit "$validation_status"
      - name: Retain additional calculation measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.additional_measurements.outputs.evidence_cleared == 'true'
        with:
          name: additional-operations-evidence
          path: |
            .canary/work/current/latest.log
            .canary/work/current/latest.json
          include-hidden-files: true
          retention-days: 7
      - name: Real automation forms on Linux Chrome
        run: |
          set +e
          python3 scripts/bounded_validation.py --timeout 600 -- node scripts/dashboard-contract-review.mjs --automation-only --dashboard-control-plane --force-node-removal
          validation_status=$?
          cat .canary/work/current/latest.log
          exit "$validation_status"
      - name: Upload bounded result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-integrations-evidence
          path: |
            .canary/work/current/latest.log
            .canary/work/current/latest.json
            .canary/dashboard-contract-current.json
            .canary/node-export-current.png
            .canary/node-revocation-current.png
          include-hidden-files: true
          retention-days: 7
