<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" role="img" aria-labelledby="title desc">
<title id="title">How a group turns a shared outage into one alert</title>
<desc id="desc">Two panels. In both, a user-defined group has an outage monitor and three dependent monitors, all down. Left, its alert is delivered: the outage monitor sends one alert, and the dependent monitors hold back their alerts while still recording checks and incidents. Right, its alert is not delivered because there is no webhook or delivery fails: after their grace period the dependent monitors alert on their own, so the receiver still hears about the outage.</desc>
<defs>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
</defs>
<rect x="0.75" y="0.75" width="958.5" height="446.5" rx="18" fill="#151514" stroke="#2b2b28" stroke-width="1.5"/>
<text class="s" x="32" y="44" font-size="18" fill="#f0efec" font-weight="700">One shared outage, one alert</text>
<text class="s" x="32" y="68" font-size="14" fill="#a3a198">A group you define names an outage monitor. While it is down and its own alert got through, its dependents hold theirs.</text>
