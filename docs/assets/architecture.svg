<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">Uptime-Canary architecture</title>
<desc id="desc">Three of about six independent headless Go nodes, canary-1 to canary-3. Each node runs its own checks (HTTP, ping, TCP, TLS, DNS, databases, queues, infrastructure protocols, manual and push), incidents, alerts, maintenance holds and group suppression, a management API, and a local SQLite database, and reaches monitored services and alert destinations (Discord, email services, webhooks) directly. Nodes sync with every listed peer in bounded, resumable pages over a private network or VPN using a cluster token. They share monitor and group revisions, tombstones, the latest observation per node, incidents and send receipts. Raw check history, accounts and the database stay on each node. Operators use the CLI or the optional web dashboard, which talks to one node at a time with an account token.</desc>
