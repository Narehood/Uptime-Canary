    <script>
      // Apply the saved or system theme before first paint. Only the theme choice is stored, never tokens.
      try {
        var saved = localStorage.getItem('uptime-canary.theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="font:14px system-ui;padding:16px">The Uptime Canary dashboard needs JavaScript. Nodes keep monitoring without it; use the CLI to manage them.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
