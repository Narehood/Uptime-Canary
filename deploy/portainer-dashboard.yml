# One static dashboard, with no node, credentials or persistent data.
# Also usable with docker compose -f this-file. See docs/portainer.md.
services:
  web:
    image: ${CANARY_WEB_IMAGE:-uptime-canary-web:development}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    ports:
      - "${CANARY_WEB_BIND_ADDRESS:-127.0.0.1}:${CANARY_WEB_PORT:-18347}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
