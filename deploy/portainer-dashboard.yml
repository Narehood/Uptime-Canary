# Dashboard-owned accounts and shared node registry. Retain both private volumes.
# Pull from GHCR; also usable with docker compose -f this-file.
services:
  web:
    image: ${CANARY_WEB_IMAGE:-ghcr.io/narehood/uptime-canary-web:${CANARY_IMAGE_TAG:-latest}}
    pull_policy: ${CANARY_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      CANARY_LOCAL_NODE_URL: ${CANARY_LOCAL_NODE_URL:-}
      CANARY_LOCAL_NODE_TOKEN: ${CANARY_LOCAL_NODE_TOKEN:-}
      CANARY_DASHBOARD_ORIGINS: ${CANARY_CORS_ORIGINS:?Set the browser dashboard origin}
      CANARY_DASHBOARD_CONNECTION_URL: ${CANARY_DASHBOARD_CONNECTION_URL:-}
      CANARY_DASHBOARD_CONNECTION_TLS_MODE: ${CANARY_DASHBOARD_CONNECTION_TLS_MODE:-}
      CANARY_LOCAL_NODE_TLS_FINGERPRINT: ${CANARY_LOCAL_NODE_TLS_FINGERPRINT:-}
      CANARY_UPDATE_CHECKS: ${CANARY_UPDATE_CHECKS:-true}
      CANARY_DASHBOARD_NODE_IMAGE_TAG: ${CANARY_IMAGE_TAG:-latest}
    volumes:
      - canary-dashboard-data:/data
      - canary-dashboard-identity:/identity
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    ports:
      - "${CANARY_WEB_BIND_ADDRESS:-127.0.0.1}:${CANARY_WEB_PORT:-18347}:8080"
      - "${CANARY_CONNECT_BIND_ADDRESS:-127.0.0.1}:${CANARY_CONNECT_PORT:-18348}:8081"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  canary-dashboard-data:
  canary-dashboard-identity:
