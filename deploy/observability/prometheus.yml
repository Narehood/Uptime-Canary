global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: uptime-canary
    metrics_path: /api/metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /run/secrets/canary_viewer_token
    static_configs:
      - targets: ['canary.example.net:443']

# To retain beyond this Prometheus server, configure remote_write with your
# external Prometheus-compatible service's URL and credential file. Keep its
# credentials separate from the Canary viewer token. See docs/external-observability.md.
